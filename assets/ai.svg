<svg xmlns="http://www.w3.org/2000/svg" width="860" height="218" viewBox="0 0 860 218" role="img" aria-label="How I use AI"><rect x="0.5" y="0.5" width="859" height="217" rx="12" fill="#0b0f14" stroke="#1f2a33"/><circle cx="22" cy="18" r="4.5" fill="#ff5f57"/><circle cx="38" cy="18" r="4.5" fill="#febc2e"/><circle cx="54" cy="18" r="4.5" fill="#28c840"/><text x="88" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b98a5" font-weight="400" text-anchor="start">cat how-i-use-ai.md</text><text x="30" y="62" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#e6edf3" font-weight="700" text-anchor="start">How I Use AI</text><text x="30" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#34d399" font-weight="700" text-anchor="start">I own</text><text x="170" y="94" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">the specification, the contracts between layers and the behavior under failure</text><text x="30" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#34d399" font-weight="700" text-anchor="start">AI speeds up</text><text x="170" y="124" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">code, tests and refactors</text><text x="30" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#34d399" font-weight="700" text-anchor="start">Non-negotiable</text><text x="170" y="154" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">Clean Architecture, DDD, strict TypeScript, tests, Docker Compose in every project</text><text x="30" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#34d399" font-weight="700" text-anchor="start">Validation</text><text x="170" y="184" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3" font-weight="400" text-anchor="start">run it, load it, review the infrastructure; tests alone missed real bugs</text></svg>