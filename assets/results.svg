ient-pdf-worker</text><text x="44" y="173" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5" font-weight="400" text-anchor="start">702 messages, 4 failure scenarios</text><text x="816" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#34d399" font-weight="700" text-anchor="end">0 lost</text><text x="816" y="173" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5" font-weight="400" text-anchor="end">circuit breaker: 46 calls instead of 400</text><rect x="30" y="194" width="800" height="48" rx="8" fill="#34d399" fill-opacity="0.05" stroke="#1f2a33"/><text x="44" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start">leaderboard-cache-shield</text><text x="44" y="231" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5" font-weight="400" text-anchor="start">10,000 concurrent requests</text><text x="816" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#34d399" font-weight="700" text-anchor="end">10,000 queries → 1</text><text x="816" y="231" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5" font-weight="400" text-anchor="end">worst response 13.2 s → 65 ms</text><rect x="30" y="252" width="800" height="48" rx="8" fill="#34d399" fill-opacity="0.05" stroke="#1f2a33"/><text x="44" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3" font-weight="600" text-anchor="start">dashboard-bff-graphql</text><text x="44" y="289" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5" font-weight="400" text-anchor="start">over-fetching in a dashboard</text><text x="816" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-s